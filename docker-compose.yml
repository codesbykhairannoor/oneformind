version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    networks:
      - coolify
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8080/api
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - api
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COOLIFY_RESOURCE_UUID}-web.rule=Host(`${COOLIFY_FQDN}`)"
      - "traefik.http.routers.${COOLIFY_RESOURCE_UUID}-web.entrypoints=http"
      - "traefik.http.services.${COOLIFY_RESOURCE_UUID}-web.loadbalancer.server.port=3000"

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    networks:
      - coolify
    environment:
      - REDIS_URL=redis:6379
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    networks:
      - coolify
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: always

volumes:
  redis_data:

networks:
  coolify:
    external: true
